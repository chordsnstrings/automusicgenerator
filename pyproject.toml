[project]
name = "dailyfive"
version = "0.3.0"
description = "An unattended pipeline that ships five finished songs a day to DigitalOcean Spaces"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    # Not optional: init_db runs migrations on every start, so a missing
    # alembic is a crash at boot, not a degraded feature.
    "alembic>=1.13",
    "boto3>=1.34",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dailyfive = "dailyfive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: hits live third-party feeds; run with -m 'not network' to skip",
]
